<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Schedule Doctor - AamirTechs</title>
<style>
:root{--navy:#0b1f3a;--gold:#d4a72c;--bg:#f6f8fb;--ink:#1c2733;--muted:#5b6b7c;--line:#d9e1ea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:28px 20px;border-bottom:4px solid var(--gold)}
header .wrap{max-width:880px;margin:0 auto}
header h1{margin:0 0 6px;font-size:1.6rem}
header p{margin:0;color:#c8d4e4}
main{max-width:880px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(11,31,58,.08)}
label{display:block;font-weight:600;margin:14px 0 6px}
.card>label:first-child{margin-top:0}
textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
input[type=text],input[type=number],select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
.grid label{margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.95rem;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.gold{background:var(--gold);color:#0b1f3a;font-weight:600}
pre{background:#0b1f3a;color:#eef3f9;border-radius:8px;padding:16px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;min-height:60px;font-size:.85rem}
footer{max-width:880px;margin:0 auto 32px;padding:0 20px;color:var(--muted);font-size:.9rem}
footer a{color:var(--navy)}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px;font-weight:400}
</style>
</head>
<body>
<header><div class="wrap"><h1>Dispatch Schedule Doctor</h1><p>Audit a dispatch schedule CSV export for double-booked drivers and trucks, missed pickup windows, and missing travel gaps.</p></div></header>
<main><div class="card">
<label for="file">Input CSV file</label>
<input type="file" id="file" accept=".csv,text/csv">
<label for="input">Or paste the CSV</label>
<textarea id="input" spellcheck="false" placeholder="Paste a dispatch schedule CSV export here, or load the sample."></textarea>
<label>Options</label>
<div class="grid">
<div><label for="opt-gap">Min gap hours <span class="hint">(--min-gap-hours)</span></label><input type="number" id="opt-gap" step="any" value="2"></div>
<div><label for="opt-grace">Past grace hours <span class="hint">(--past-grace-hours)</span></label><input type="number" id="opt-grace" step="any" value="0"></div>
<div><label for="opt-asof">As of date <span class="hint">(--as-of)</span></label><input type="text" id="opt-asof" value="2026-11-18"></div>
</div>
<div class="row"><button class="gold" id="run" type="button">Run check</button><button class="alt" id="sample" type="button">Load sample</button><button class="alt" id="sample-clean" type="button">Load clean sample</button><button class="alt" id="sample-warnings" type="button">Load warnings-only sample</button><button class="alt" id="download" type="button">Download report</button></div>
<label for="out">Report</label>
<pre id="out">Your report will appear here.</pre>
</div></main>
<footer>
<p>Built by AamirTechs. <a href="https://aamirtechs.github.io/">All tools</a> | <a href="https://github.com/aamirtechs/dispatch-schedule-doctor">Source</a></p>
<p>Privacy: this tool runs 100% in your browser, nothing is uploaded.</p>
</footer>

        for (var j = 0; j < i; j++) {
          var earlier = placed[j], load = placed[i];
          if (windowsOverlap(earlier.pickupAt, earlier.deliveryAt, load.pickupAt, load.deliveryAt)) {
            findings.push(F(load.id, "double-booked-" + label, "error",
              label + " " + value + " is already booked on load " + earlier.id +
              " from " + fmtDateTime(earlier.pickupAt) + " to " + fmtDateTime(earlier.deliveryAt) +
              ", which overlaps this load from " + fmtDateTime(load.pickupAt) + " to " + fmtDateTime(load.deliveryAt)));
            break;
          }
        }
      }
    });
  });

  active.forEach(function (load) {
    if (!load.driver) return;
    (byDriver[load.driver] = byDriver[load.driver] || []).push(load);
  });

    var placed = byDriver[driver].filter(function (l) { return l.pickupAt !== null && l.deliveryAt !== null; });
    placed.sort(function (a, b) { return a.pickupAt.ms - b.pickupAt.ms || (a.id < b.id ? -1 : (a.id > b.id ? 1 : 0)); });

          " at " + fmtDateTime(previous.deliveryAt) + " and pickup of this load at " + fmtDateTime(load.pickupAt) +

  lines.push("");
  lines.push("Per-driver day plan:");
  lines.push(padRight("driver", 16) + " " + padLeft("loads", 6) + " " + padLeft("first pickup", 17) + " " + padLeft("last delivery", 17) + " " + padLeft("total rate", 12));
  Object.keys(perDriver).sort().forEach(function (key) {
    var rowD = perDriver[key];

    var last = rowD.lastDelivery !== null ? fmtDateTime(rowD.lastDelivery) : "-";
    lines.push(padRight(rowD.driver, 16) + " " + padLeft(rowD.loads, 6) + " " + padLeft(first, 17) + " " + padLeft(last, 17) + " " + padLeft(moneyStr(rowD.totalRate), 12));
  });
  if (findings.length === 0) { lines.push(""); lines.push("All loads clean."); }
  return lines.join("\n") + "\n";
};
